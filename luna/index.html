<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna's Magical World</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    color:#fff;
    background:
      radial-gradient(circle at 50% 0%,#60458c 0,#24163f 42%,#0d0918 100%);
    min-height:100vh;
}

body:before{
    content:"✦  ✧  ⋆  ✦  ✧  ⋆  ✦  ✧";
    position:fixed;
    top:15px;
    left:0;
    width:100%;
    text-align:center;
    color:#f5d98c;
    opacity:.35;
    font-size:22px;
    pointer-events:none;
}

.header{
    text-align:center;
    padding:55px 18px 35px;
}

.moon{
    font-size:65px;
    color:#f7dc91;
    text-shadow:0 0 30px #f7dc91;
}

.logo{
    font-size:30px;
    letter-spacing:3px;
    color:#f7dc91;
    font-weight:bold;
    margin:12px 0;
}

.collection{
    letter-spacing:4px;
    font-size:13px;
    color:#d9c9ef;
    margin-top:18px;
}

h1{
    font-size:34px;
    margin:12px 0;
}

.subtitle{
    color:#d8cbea;
    font-size:17px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:15px 18px 60px;
}

.intro{
    text-align:center;
    padding:28px 20px;
    margin-bottom:25px;
    border:1px solid #f7dc9140;
    border-radius:25px;
    background:#ffffff0d;
    box-shadow:0 15px 45px #0006;
}

.intro h2{
    color:#f7dc91;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.story{
    min-height:235px;
    padding:22px;
    border-radius:22px;
    border:1px solid #f7dc9140;
    background:linear-gradient(145deg,#ffffff16,#ffffff06);
    box-shadow:0 12px 35px #0007;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:.25s;
}

.story:hover{
    transform:translateY(-5px);
    border-color:#f7dc91aa;
}

.number{
    color:#f7dc91;
    letter-spacing:2px;
    font-size:13px;
}

.story h3{
    font-size:21px;
    line-height:1.3;
    margin:14px 0;
}

.free{
    display:inline-block;
    padding:11px 16px;
    border-radius:12px;
    background:#f7dc91;
    color:#21152f;
    font-weight:bold;
    text-align:center;
}

.lock{
    color:#d8cbea;
    padding:11px;
    border-radius:12px;
    background:#ffffff10;
    border:1px solid #ffffff20;
    text-align:center;
}

.price{
    color:#f7dc91;
    font-weight:bold;
    margin-bottom:9px;
}

footer{
    text-align:center;
    padding:30px;
    color:#9d91ae;
    border-top:1px solid #ffffff18;
}

@media(max-width:600px){
    .logo{font-size:22px}
    h1{font-size:27px}
    .story h3{font-size:19px}
}
</style>
</head>

<body>

<header class="header">

<div class="moon">☾</div>

<div class="logo">
LUNA'S MAGICAL WORLD
</div>

<div class="collection">
COLLECTION 1
</div>

<h1>
Luna and the Amazing Farm
</h1>

<div class="subtitle">
100 Magical Illustrated Stories
</div>

</header>

<main class="container">

<section class="intro">
<h2>Welcome to Luna's World ✨</h2>
<p>
A magical journey begins here.
</p>
<p>
Stories 01–10 are free.
</p>
<p>
Each following collection contains 10 stories for 10 USDT.
</p>
</section>

<section class="grid" id="stories"></section>

</main>

<footer>
© Luna's Magical World · 100 Stories
</footer>

<script>

const titles = [

"A New Home, A New World",
"A Sound No One Heard",
"A Letter for the One Who Hears the Forest",
"Someone Behind the Fence",
"The Tree That Should Not Be Touched",
"Garo's Little Secret",
"The Voices of Animals",
"The Girl Beside the Pond",
"The Boat on the Water",
"A Light in the Forest",

"What Grandmother Knew",
"The Old Map",
"A Sound Beneath the Ground",
"A Place That Was Not on the Map",
"Grandmother's Key",
"The Little Chest",
"Something Beneath the Soil",
"Seeds with a Strange Mark",
"The First Planting",
"The Plant That Grew Overnight",

"A Fruit That Had Never Existed",
"The Animals Know the Garden",
"The First Real Conversation",
"The Secret of Grandmother's Seeds",
"The Garden That Keeps Growing",
"A Path Between the Roots",
"The Room Beneath the Tree",
"A Picture from the Past",
"A Name Luna Did Not Know",
"The Tree Awakens",

"Footprints in the Mud",
"The Guardians of the Forest",
"The River That Changed Its Course",
"The Abandoned House",
"A Bell in the Mist",
"The Fox That Spoke",
"The Moving Trees",
"The Little Island",
"The Lost Notebook",
"The Story of the First Guardian",

"A Seed from Another Land",
"An Enemy Still Unseen",
"The Great Storm",
"Saving the Farm",
"A Gate Among the Roots",
"The Gate Is Closed",
"Three Signs",
"The Secret of the Ancient Stones",
"Grandmother Does Not Tell Everything",
"The First Entry",

"The Land Beyond the Gate",
"The City Without a Sun",
"The Man Who Knew Luna",
"The Mysterious Market",
"A Stranger's Gift",
"The Way Back",
"Garo Disappears",
"Searching the City",
"The Gate Is Closing",
"Separation",

"Morning in the Unknown Land",
"New Friends",
"The Laws of This World",
"The Blue Forest",
"The Giant Birds",
"The Reversed River",
"The Distant Castle",
"The Secret of the Ancient King",
"The Map of Seven Lands",
"Luna's Name on the Stone",

"The Truth About the Seeds",
"The Enemy Steps from the Shadows",
"The Battle in the Forest",
"A Road That Opens Only Once",
"The Return Home",
"A Farm That Had Changed",
"One Year in One Night",
"The Animals Were No Longer the Same",
"The Second Letter",
"Father's Secret",

"Grandmother's Past",
"Luna's First Guardian",
"The Enemy's Sign",
"Danger for the Family",
"The Confrontation by the River",
"The Secret of the Tree Revealed",
"The Last Seed",
"Luna's Choice",
"The Night the Sky Split",
"The Beginning of the Great War",

"The Shadows Return",
"Everyone Together",
"The Battle at the Farm",
"Garo's Secret",
"The Last Gate",
"The Great Sacrifice",
"Light in the Darkness",
"Saving the Farm",
"The Chest Opens Again",
"Beyond the Gate"

];

const grid=document.getElementById("stories");

titles.forEach((title,index)=>{

    const n=index+1;
    const number=String(n).padStart(2,"0");

    const card=document.createElement("article");
    card.className="story";

    let button="";

    if(n<=10){

        button=`
        <a class="free" href="#">
        READ STORY ${number}
        </a>`;

    }else{

        const pack=Math.ceil(n/10);

        button=`
        <div>
        <div class="price">
        🔒 PACK ${pack} · 10 USDT
        </div>
        <div class="lock">
        LOCKED
        </div>
        </div>`;

    }

    card.innerHTML=`

        <div>

        <div class="number">
        STORY ${number}
        </div>

        <h3>
        ${title}
        </h3>

        </div>

        ${button}

    `;

    grid.appendChild(card);

});

</script>

</body>
</html>
