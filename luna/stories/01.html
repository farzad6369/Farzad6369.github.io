<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luna's Magical World</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#55347e 0%,#251438 42%,#0e0918 100%);
    color:white;
    font-family:Georgia,serif;
}

.header{
    text-align:center;
    padding:55px 20px 35px;
}

.moon{
    font-size:58px;
    color:#f0d27a;
    text-shadow:0 0 25px rgba(240,210,122,.45);
}

.logo{
    font-size:30px;
    font-weight:bold;
    letter-spacing:4px;
    color:#f0d27a;
    margin-top:10px;
}

.collection-label{
    margin-top:28px;
    color:#d9bd70;
    letter-spacing:3px;
    font-size:14px;
}

h1{
    font-size:42px;
    color:#fff0b5;
    margin:12px 0;
}

.subtitle{
    color:#d8cce5;
    font-size:17px;
}

.intro{
    max-width:750px;
    margin:0 auto 35px;
    padding:0 20px;
    text-align:center;
    color:#d9cee5;
    line-height:1.8;
}

.grid{
    max-width:1000px;
    margin:auto;
    padding:10px 18px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:18px;
}

.card{
    position:relative;
    padding:24px;
    border-radius:20px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(216,184,106,.28);
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#d8b86a;
}

.number{
    color:#d8b86a;
    font-size:13px;
    letter-spacing:2px;
}

h2{
    font-size:20px;
    color:#fff0bb;
    line-height:1.4;
    margin:10px 0 15px;
}

.free{
    display:inline-block;
    color:#9ff0bd;
    font-size:13px;
    margin-bottom:14px;
}

.locked{
    display:inline-block;
    color:#c5b8d1;
    font-size:13px;
    margin-bottom:14px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    border:1px solid #d8b86a;
    border-radius:25px;
    padding:10px 18px;
    color:#f0d27a;
    font-size:13px;
    transition:.2s;
}

.btn:hover{
    background:#d8b86a;
    color:#21152f;
}

.disabled{
    opacity:.55;
    cursor:default;
}

.pack{
    color:#cfc1dc;
    font-size:13px;
    margin-bottom:13px;
}

.footer{
    text-align:center;
    padding:30px 20px 50px;
    color:#91849f;
    font-size:13px;
}

@media(max-width:600px){

    .logo{
        font-size:22px;
    }

    h1{
        font-size:30px;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="moon">☾ ✦</div>

    <div class="logo">
        LUNA'S MAGICAL WORLD
    </div>

    <div class="collection-label">
        COLLECTION 1
    </div>

    <h1>
        Luna and the Amazing Farm
    </h1>

    <div class="subtitle">
        100 Magical Illustrated Stories
    </div>

</header>


<div class="intro">

    Welcome to Luna's Magical World.

    <br>

    The first ten stories are free.
    More adventures will unlock as Luna's journey continues.

</div>


<main class="grid" id="stories"></main>


<footer class="footer">

    LUNA'S MAGICAL WORLD © 2026

    <br><br>

    Collection 1 — Luna and the Amazing Farm

</footer>


<script>

const stories = [

["A New Home, A New World", true],
["A Sound No One Heard", true],
["A Letter for the One Who Hears the Forest", true],
["Someone Behind the Fence", true],
["The Tree That Should Not Be Touched", true],
["Garo's Little Secret", true],
["The Voices of Animals", true],
["The Girl Beside the Pond", true],
["The Boat on the Water", true],
["A Light in the Forest", true],

["What Grandmother Knew", false],
["The Old Map", false],
["A Sound Beneath the Ground", false],
["A Place That Was Not on the Map", false],
["Grandmother's Key", false],
["The Little Chest", false],
["Something Beneath the Soil", false],
["Seeds with a Strange Mark", false],
["The First Planting", false],
["The Plant That Grew Overnight", false],

["A Fruit That Had Never Existed", false],
["The Animals Know the Garden", false],
["The First Real Conversation", false],
["The Secret of Grandmother's Seeds", false],
["The Garden That Keeps Growing", false],
["A Path Between the Roots", false],
["The Room Beneath the Tree", false],
["A Picture from the Past", false],
["A Name Luna Did Not Know", false],
["The Tree Awakens", false],

["Footprints in the Mud", false],
["The Guardians of the Forest", false],
["The River That Changed Its Course", false],
["The Abandoned House", false],
["A Bell in the Mist", false],
["The Fox That Spoke", false],
["The Moving Trees", false],
["The Little Island", false],
["The Lost Notebook", false],
["The Story of the First Guardian", false],

["A Seed from Another Land", false],
["An Enemy Still Unseen", false],
["The Great Storm", false],
["Saving the Farm", false],
["A Gate Among the Roots", false],
["The Gate Is Closed", false],
["Three Signs", false],
["The Secret of the Ancient Stones", false],
["Grandmother Does Not Tell Everything", false],
["The First Entry", false],

["The Land Beyond the Gate", false],
["The City Without a Sun", false],
["The Man Who Knew Luna", false],
["The Mysterious Market", false],
["A Stranger's Gift", false],
["The Way Back", false],
["Garo Disappears", false],
["Searching the City", false],
["The Gate Is Closing", false],
["Separation", false],

["Morning in the Unknown Land", false],
["New Friends", false],
["The Laws of This World", false],
["The Blue Forest", false],
["The Giant Birds", false],
["The Reversed River", false],

["The Truth About the Seeds", false],

["A Road That Opens Only Once", false],

["One Year in One Night", false],

["Grandmother's Past", false],

["Danger for the Family", false],
["The Confrontation by the River", false],
["The Secret of the Tree Revealed", false],
["The Last Seed", false],
["Luna's Choice", false],
["The Night the Sky Split", false],
["The Beginning of the Great War", false],

["The Shadows Return", false],
["Everyone Together", false],
["The Battle at the Farm", false],
["Garo's Secret", false],
["The Last Gate", false],
["The Great Sacrifice", false],
["Light in the Darkness", false],
["Saving the Farm", false],
["The Chest Opens Again", false],
["Beyond the Gate", false]

];


const container = document.getElementById("stories");


stories.forEach((story,index)=>{

    const number = index + 1;
    const title = story[0];
    const isFree = story[1];

    const card = document.createElement("div");

    card.className = "card";


    let button = "";

    if(number === 1){

        button = `
            <a class="btn" href="stories/01.html">
                READ STORY
            </a>
        `;

    }else if(isFree){

        button = `
            <span class="btn disabled">
                COMING SOON
            </span>
        `;

    }else{

        const pack = Math.ceil((number - 10) / 10);

        button = `
            <div class="pack">
                PACK ${pack} — 10 USDT
            </div>

            <span class="btn disabled">
                🔒 LOCKED
            </span>
        `;
    }


    card.innerHTML = `

        <div class="number">
            STORY ${String(number).padStart(2,"0")}
        </div>

        <h2>
            ${title}
        </h2>

        ${
            isFree
            ?
            `<div class="free">FREE</div>`
            :
            `<div class="locked">LOCKED</div>`
        }

        <br>

        ${button}

    `;


    container.appendChild(card);

});

</script>

</body>
</html>
